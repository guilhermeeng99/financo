name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The backend is deployed manually (`firebase deploy --only functions`), so
  # nothing here used to run its checks — a broken Cloud Function could reach
  # main unnoticed. This job mirrors the README's backend checklist. It runs
  # alongside `deploy` rather than gating it: the Flutter release does not ship
  # any of this code, so a red backend should be visible, not blocking.
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run slang
      # The project's post-change checklist requires zero analyzer issues;
      # only `flutter test` was enforced here before.
      - run: flutter analyze
      - run: flutter test
      # Both tags must track the resolved versions in pubspec.lock (sqlite3,
      # drift) and the copies documented in README.md — bump all four together.
      - name: Download Drift web assets
        run: |
          curl -L -o web/sqlite3.wasm \
            "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.1/sqlite3.wasm"
          curl -L -o web/drift_worker.dart.js \
            "https://github.com/simolus3/drift/releases/download/drift-2.34.3/drift_worker.js"
      - name: Build web
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build web --release --no-tree-shake-icons \
            --base-href /financo/app/ \
            --build-number=$GITHUB_RUN_NUMBER \
            --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --build-number=$GITHUB_RUN_NUMBER \
            --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - name: Build landing site
        run: |
          # --frozen-lockfile so the deployed bundle resolves exactly what
          # pnpm-lock.yaml pins, instead of whatever is latest at build time.
          pnpm -C site install --frozen-lockfile
          pnpm -C site typecheck
          pnpm -C site build

      - name: Assemble GitHub Pages bundle
        run: |
          # Landing page at the Pages root (/financo/), Flutter web app one level
          # down (/financo/app/), signed APK at the root for the download button.
          rm -rf public
          mkdir -p public/app
          cp -r site/dist/. public/
          cp -r build/web/. public/app/
          cp build/app/outputs/flutter-apk/app-release.apk public/financo.apk

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public

      - name: Generate release notes from commit
        id: release_notes
        run: |
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            echo "Commit: ${GITHUB_SHA::7}"
            echo ""
            git log -1 --pretty=format:"%s%n%n%b"
            echo ""
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:356891758869:android:028ae37486c30b8f4dd91c"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANDROID }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ steps.release_notes.outputs.notes }}
